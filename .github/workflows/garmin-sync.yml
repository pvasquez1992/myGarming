name: Sincronizar Garmin
on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
    inputs:
      full:
        description: Revisar todo el historial
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: garmin-sync
  cancel-in-progress: false
jobs:
  sync:
    if: vars.GARMIN_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: sync/requirements.txt
      - name: Instalar dependencias verificadas
        run: python -m pip install --require-hashes -r sync/requirements.txt
      - name: Consultar Garmin e importar actividades
        env:
          GARMIN_API_URL: https://my-garmin-api.pvasquez1992.workers.dev
          GARMIN_SYNC_KEY: ${{ secrets.GARMIN_SYNC_KEY }}
          GARMIN_SESSION_KEY: ${{ secrets.GARMIN_SESSION_KEY }}
          FULL_SYNC: ${{ inputs.full }}
        run: |
          if [ "$FULL_SYNC" = "true" ]; then
            python sync/runner.py --full
          else
            python sync/runner.py
          fi
